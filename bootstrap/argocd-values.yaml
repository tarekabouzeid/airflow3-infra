# Values for the argo/argo-cd chart. Used identically by:
#   1. The one-time imperative bootstrap install (scripts/30-install-argocd.sh)
#   2. platform/bootstrap/app-argocd-self.yaml, which has Argo CD manage itself from here on
# Upgrading Argo CD = bump platform/bootstrap/app-argocd-self.yaml's targetRevision, commit, sync.
# This file does not change across that upgrade unless a new version needs a new value.

global:
  domain: argocd.local

configs:
  cm:
    application.instanceLabelKey: argocd.argoproj.io/instance
  params:
    server.insecure: "true"   # local lab only: TLS terminates at kubectl port-forward, not at argocd-server

server:
  service:
    type: ClusterIP
  extraArgs:
    - --insecure

controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

applicationSet:
  enabled: true

redis:
  enabled: true

# Confirmed live: this PreSync hook Job's ttlSecondsAfterFinished races against Argo CD's own
# hook-completion tracking (a known open upstream bug, argoproj/argo-helm#2887) - the Job
# self-deletes (cascading its supporting Role/RoleBinding via ownerReferences) before Argo CD
# reliably observes it reach Succeeded, wedging the argocd Application's own sync in "Running"
# forever ("waiting for completion of hook.../argocd-redis-secret-init"), reproduced here even
# retrying/resyncing the SAME already-deployed revision and restarting the application-controller.
# The secret it exists to create (argocd-redis) is already present and stable - disabling this
# hook (the chart's own documented escape hatch) stops the wedge from recurring on every future
# sync without needing to hand-provision anything.
redisSecretInit:
  enabled: false

dex:
  enabled: false   # no SSO for a local lab; CLI/UI auth is via the built-in admin secret
