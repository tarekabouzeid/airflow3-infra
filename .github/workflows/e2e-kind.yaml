name: e2e-kind

# Primary correctness test for this repo: there is no local Docker/Kubernetes access in the
# development environment this repo was built in, so this workflow - not a human running `make
# bootstrap` - is what actually proves the platform's charts and scripts work against a real
# cluster, real Argo CD, real Vault, real External Secrets Operator, and a real Spark job.
#
# Scope, deliberately: ONE kind cluster, not three. A full 3-cluster + remote-execution rehearsal
# needs resources and cross-cluster Docker networking a shared GitHub-hosted runner cannot give
# it reliably - that is exercised locally instead (see docs/runbook-bootstrap.md). Here, "remote"
# execution is simulated by pointing the "k8s_remote" Airflow connection back at the SAME cluster
# via an explicit kubeconfig (not the in-cluster identity) - which still proves the
# KubernetesPodOperator/SparkKubernetesOperator "external connection" code path for real.
#
# Also deliberately: the tenant layer (charts/tenant-project, charts/airflow-tenant) is applied
# directly with `helm template | kubectl apply`, not wrapped in Argo CD Applications/
# ApplicationSets, to avoid needing a real tenant git repo + GitHub token inside CI. The
# ApplicationSet templating itself is checked statically by lint.yaml/policy.yaml; Argo CD's own
# self-management and its management of Vault ARE exercised for real, below.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "0 4 * * *"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
      - name: install kind
        run: |
          # NOTE: this repo has its own top-level kind/ directory (kind/*.yaml cluster configs) -
          # download the binary somewhere else first to avoid "Is a directory" colliding with it.
          curl -Lo /tmp/kind-binary https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x /tmp/kind-binary && sudo mv /tmp/kind-binary /usr/local/bin/kind
          kind version

      - name: load pinned versions
        run: |
          source versions.env
          {
            echo "ARGOCD_CHART_VERSION_START=${ARGOCD_CHART_VERSION_START}"
            echo "ARGOCD_CHART_REPO=${ARGOCD_CHART_REPO}"
            echo "AIRFLOW_CHART_REPO=${AIRFLOW_CHART_REPO}"
            echo "ESO_CHART_REPO=${ESO_CHART_REPO}"
            echo "VAULT_CHART_REPO=${VAULT_CHART_REPO}"
            echo "SPARK_OPERATOR_CHART_REPO=${SPARK_OPERATOR_CHART_REPO}"
            echo "KIND_NODE_IMAGE=${KIND_NODE_IMAGE}"
          } >> "$GITHUB_ENV"

      - name: create kind cluster
        run: |
          sed "s#\${KIND_NODE_IMAGE}#${KIND_NODE_IMAGE}#" kind/af-mgmt.yaml > /tmp/ci-cluster.yaml || true
          cat > /tmp/ci-cluster.yaml <<YAML
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          name: ci
          nodes:
            - role: control-plane
              image: ${KIND_NODE_IMAGE}
          YAML
          kind create cluster --config /tmp/ci-cluster.yaml
          kubectl cluster-info

      - name: build and load the airflow-tenant image
        run: |
          docker build -t airflow-tenant:ci-1 --build-arg AIRFLOW_VERSION=3.1.7 images/airflow
          kind load docker-image airflow-tenant:ci-1 --name ci

      - name: add chart repos
        run: |
          # Transient network blips fetching a chart index (connection reset, timeout) have been
          # observed on this runner pool - retry each add a few times before failing the whole job
          # over what is usually a few-second hiccup.
          add_repo() {
            local name=$1 url=$2
            for i in 1 2 3; do
              helm repo add "$name" "$url" && return 0
              echo "helm repo add $name failed (attempt $i/3), retrying in 5s..."
              sleep 5
            done
            return 1
          }
          add_repo argo "${ARGOCD_CHART_REPO}"
          add_repo apache-airflow "${AIRFLOW_CHART_REPO}"
          add_repo external-secrets "${ESO_CHART_REPO}"
          add_repo hashicorp "${VAULT_CHART_REPO}"
          add_repo spark-operator "${SPARK_OPERATOR_CHART_REPO}"
          helm repo update

      - name: install Argo CD (pinned start-of-upgrade-path version)
        run: |
          helm upgrade --install argocd argo/argo-cd \
            --version "${ARGOCD_CHART_VERSION_START}" \
            -n argocd --create-namespace \
            -f bootstrap/argocd-values.yaml \
            --wait --timeout 10m

      - name: Argo CD manages itself + deploys Vault
        run: |
          kubectl apply -f platform/bootstrap/app-argocd-self.yaml
          kubectl apply -f platform/bootstrap/vault-af-mgmt.yaml
          # Deliberately NOT gating on the Application's sync/health status here:
          # - Health can't pass yet regardless: a fresh non-dev Vault starts sealed and
          #   uninitialized, so its readiness probe (`vault status`) fails until the
          #   "vault init + unseal" step below runs. Verified for real afterward instead.
          # - Sync also isn't a reliable gate: on Argo CD 7.8.x (pinned start-of-upgrade
          #   version), this chart's StatefulSet resource can sit permanently OutOfSync even
          #   once fully applied, because the API server auto-populates a StatefulSet default
          #   (persistentVolumeClaimRetentionPolicy) that this Argo CD version's diffing doesn't
          #   normalize away - every other resource in the Application shows Synced, only this
          #   one field-level cosmetic diff never resolves. A prior iteration of this workflow
          #   waited on sync=Synced and timed out here despite Vault being fully up.
          # What actually matters for the rest of this job is simpler and more direct: does the
          # vault-0 pod exist and run. Check that instead of Argo CD's own bookkeeping.
          echo "waiting for the vault-0 pod to exist and reach Running phase (not necessarily Ready)..."
          for i in $(seq 1 60); do
            phase=$(kubectl -n vault get pod vault-0 -o jsonpath='{.status.phase}' 2>/dev/null || true)
            echo "  [$i] vault-0 phase=$phase"
            [ "$phase" = "Running" ] && break
            sleep 5
          done
          if [ "$phase" != "Running" ]; then
            echo "::group::vault pods"
            kubectl -n vault get pods -o wide || true
            echo "::endgroup::"
            echo "::group::vault-0 describe"
            kubectl -n vault describe pod vault-0 || true
            echo "::endgroup::"
            echo "::group::vault namespace events"
            kubectl -n vault get events --sort-by=.lastTimestamp || true
            echo "::endgroup::"
            exit 1
          fi

      - name: "apply tenant-project (namespace guardrails: airflow + workloads)"
        run: |
          # Must run BEFORE installing Spark Operator: its jobNamespaces setting below creates
          # RBAC resources inside tenant-ci-workloads, which only exists once this step's
          # Namespace manifest is applied. (Confirmed failure mode: "namespaces
          # \"tenant-ci-workloads\" not found" from the spark-operator helm install when this was
          # ordered after it.) Plain kubectl apply, not an Argo CD Application - no dependency on
          # Vault/ESO/Spark Operator, just core Namespace/Quota/LimitRange/NetworkPolicy/RBAC.
          helm template p1 charts/tenant-project -f ci/values-project-ci.yaml | kubectl apply --server-side -f -
          helm template p2 charts/tenant-project -f ci/values-workloads-ci.yaml | kubectl apply --server-side -f -

      - name: install External Secrets Operator + Spark Operator (plain helm, in-cluster)
        run: |
          helm upgrade --install external-secrets external-secrets/external-secrets \
            -n external-secrets --create-namespace --set installCRDs=true --wait --timeout 5m
          helm upgrade --install spark-operator spark-operator/spark-operator \
            -n spark-operator --create-namespace \
            --set spark.jobNamespaces[0]=tenant-ci-workloads --wait --timeout 5m

      - name: vault init + unseal
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do kubectl -n vault get pod vault-0 >/dev/null 2>&1 && break; sleep 5; done
          kubectl -n vault wait --for=condition=Ready pod/vault-0 --timeout=120s || true
          init_json=$(kubectl -n vault exec -i vault-0 -- vault operator init -key-shares=1 -key-threshold=1 -format=json)
          echo "$init_json" > /tmp/vault-keys.json
          ROOT_TOKEN=$(jq -r '.root_token' /tmp/vault-keys.json)
          KEY=$(jq -r '.unseal_keys_b64[0]' /tmp/vault-keys.json)
          kubectl -n vault exec -i vault-0 -- vault operator unseal "$KEY"
          echo "ROOT_TOKEN=${ROOT_TOKEN}" >> "$GITHUB_ENV"

      - name: confirm vault-0 becomes Ready now that it's unsealed (proves the readiness probe + Argo CD health wiring, not just kubectl exec access)
        run: |
          set -euo pipefail
          if kubectl -n vault wait --for=condition=Ready pod/vault-0 --timeout=90s; then
            echo "vault-0 is Ready."
          else
            echo "::error::vault-0 did not become Ready even after unsealing - investigate the readiness probe itself, not the seal state."
            kubectl -n vault describe pod vault-0
            exit 1
          fi

      - name: configure vault (kubernetes auth, KV mount, policies, roles, seed secrets)
        run: |
          set -euo pipefail
          vexec() { kubectl -n vault exec -i vault-0 -- env VAULT_TOKEN="${ROOT_TOKEN}" "$@"; }

          vexec vault secrets enable -path=tenant-ci -version=2 kv

          kubectl -n kube-system apply -f - <<'YAML'
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: vault-token-reviewer
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: vault-token-reviewer-auth-delegator
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: system:auth-delegator
          subjects:
            - kind: ServiceAccount
              name: vault-token-reviewer
              namespace: kube-system
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: vault-token-reviewer-token
            annotations:
              kubernetes.io/service-account.name: vault-token-reviewer
          type: kubernetes.io/service-account-token
          YAML

          JWT=""
          for i in $(seq 1 30); do
            JWT=$(kubectl -n kube-system get secret vault-token-reviewer-token -o jsonpath='{.data.token}' 2>/dev/null | base64 -d || true)
            [ -n "$JWT" ] && break
            sleep 2
          done
          [ -n "$JWT" ]

          CA=$(kubectl config view --raw --minify -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d)

          vexec vault auth enable -path=kubernetes-ci kubernetes
          vexec vault write auth/kubernetes-ci/config \
            kubernetes_host="https://kubernetes.default.svc" \
            kubernetes_ca_cert="${CA}" \
            token_reviewer_jwt="${JWT}"

          vexec vault policy write tenant-ci-airflow - <<'HCL'
          path "tenant-ci/data/connections/*" { capabilities = ["read", "list"] }
          path "tenant-ci/data/variables/*"   { capabilities = ["read", "list"] }
          HCL
          vexec vault policy write tenant-ci-eso - <<'HCL'
          path "tenant-ci/data/db"               { capabilities = ["read"] }
          path "tenant-ci/data/workload-secrets" { capabilities = ["read"] }
          HCL

          vexec vault write auth/kubernetes-ci/role/tenant-ci-airflow \
            bound_service_account_names="*" \
            bound_service_account_namespaces=tenant-ci-airflow \
            policies=tenant-ci-airflow ttl=1h
          vexec vault write auth/kubernetes-ci/role/tenant-ci-eso \
            bound_service_account_names="*" \
            bound_service_account_namespaces=tenant-ci-airflow,tenant-ci-workloads \
            policies=tenant-ci-eso ttl=1h

          vexec vault kv put tenant-ci/db user=tenant_ci password="$(openssl rand -hex 16)" dbname=tenant_ci
          vexec vault kv put tenant-ci/workload-secrets greeting="hello from Vault via ESO, tenant-ci"
          vexec vault kv put tenant-ci/variables/hello value="hello from Vault, tenant-ci"

      - name: wire the "remote" (same-cluster) k8s_remote connection
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do kubectl -n tenant-ci-workloads get sa tenant-ci-workload-runner >/dev/null 2>&1 && break; sleep 3; done
          kubectl -n tenant-ci-workloads apply -f - <<'YAML'
          apiVersion: v1
          kind: Secret
          metadata:
            name: tenant-ci-workload-runner-token
            annotations:
              kubernetes.io/service-account.name: tenant-ci-workload-runner
          type: kubernetes.io/service-account-token
          YAML
          TOKEN=""
          for i in $(seq 1 30); do
            TOKEN=$(kubectl -n tenant-ci-workloads get secret tenant-ci-workload-runner-token -o jsonpath='{.data.token}' 2>/dev/null | base64 -d || true)
            [ -n "$TOKEN" ] && break
            sleep 2
          done
          [ -n "$TOKEN" ]
          CA=$(kubectl config view --raw --minify -o jsonpath='{.clusters[0].cluster.certificate-authority-data}')
          KUBECONFIG_YAML=$(cat <<YAML
          apiVersion: v1
          kind: Config
          clusters:
            - name: ci
              cluster: {server: "https://kubernetes.default.svc", certificate-authority-data: "${CA}"}
          contexts:
            - name: ci
              context: {cluster: ci, namespace: tenant-ci-workloads, user: tenant-ci-workload-runner}
          current-context: ci
          users:
            - name: tenant-ci-workload-runner
              user: {token: "${TOKEN}"}
          YAML
          )
          EXTRA=$(jq -n --arg kc "$KUBECONFIG_YAML" '{kube_config: $kc, in_cluster: false}')
          kubectl -n vault exec -i vault-0 -- env VAULT_TOKEN="${ROOT_TOKEN}" \
            vault kv put tenant-ci/connections/k8s_remote conn_type=kubernetes extra="${EXTRA}"

      - name: workload-secrets SecretStore + ExternalSecret (CI fixture, stands in for a tenant's deploy/workloads chart)
        run: |
          kubectl -n tenant-ci-workloads apply -f - <<YAML
          apiVersion: external-secrets.io/v1
          kind: SecretStore
          metadata:
            name: tenant-ci-vault
          spec:
            provider:
              vault:
                server: http://vault.vault.svc:8200
                path: tenant-ci
                version: v2
                auth:
                  kubernetes:
                    mountPath: kubernetes-ci
                    role: tenant-ci-eso
                    serviceAccountRef:
                      name: tenant-ci-workload-runner
          ---
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: tenant-ci-workload-secrets
          spec:
            refreshInterval: 1h
            secretStoreRef: {name: tenant-ci-vault, kind: SecretStore}
            target: {name: tenant-ci-workload-secrets, creationPolicy: Owner}
            data:
              - secretKey: greeting
                remoteRef: {key: workload-secrets, property: greeting}
          YAML

      - name: deploy tenant-ci Airflow
        run: |
          # --namespace here matters, not just cosmetically: charts/airflow-tenant's own templates
          # (SecretStore, dag-loader Job, dags PVC, postgres ExternalSecrets) key off
          # .Release.Namespace, which defaults to "default" when helm template is run without it -
          # and postgres-lite's StatefulSet sets no namespace at all, so it follows kubectl's own
          # target instead. Confirmed failure mode without both flags: everything applied cleanly,
          # but into the "default" namespace, so the very next step's
          # `kubectl -n tenant-ci-airflow rollout status statefulset/tenant-ci-airflow-postgres`
          # got "not found".
          helm dependency build charts/airflow-tenant
          helm template tenant-ci-airflow charts/airflow-tenant --namespace tenant-ci-airflow -f ci/values-airflow-ci.yaml \
            | kubectl apply --server-side -n tenant-ci-airflow -f -

      - name: wait for postgres + ExternalSecrets + Airflow components
        run: |
          set -euo pipefail
          dump_diag() {
            echo "::group::diagnostics"
            # node-wide CPU/memory allocation breakdown - the last few failures were "Insufficient
            # cpu" scheduling errors, and this is the only way to see what's actually consuming the
            # single KIND node's allocatable capacity (Argo CD/Vault/ESO/Spark Operator/kube-system
            # all share this one node with tenant-ci-airflow) instead of guessing at it.
            kubectl describe node ci-control-plane | sed -n '/Capacity/,/Events/p' || true
            kubectl get pods -A -o=custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,CPU-REQ:.spec.containers[*].resources.requests.cpu,MEM-REQ:.spec.containers[*].resources.requests.memory' || true
            kubectl -n tenant-ci-airflow get externalsecret -o wide || true
            kubectl -n tenant-ci-airflow get secretstore -o yaml || true
            kubectl -n tenant-ci-airflow get pods -o wide || true
            kubectl -n tenant-ci-airflow describe pod -l app.kubernetes.io/name=postgres || true
            kubectl -n tenant-ci-airflow logs -l app.kubernetes.io/name=postgres --all-containers --tail=100 || true
            # postgres itself is confirmed healthy as of run #19 - the new blocker is
            # run-airflow-migrations crash-looping (every other component's
            # wait-for-airflow-migrations init container just polls for this job's success), so
            # dump its actual logs directly instead of guessing why `airflow db migrate` fails.
            kubectl -n tenant-ci-airflow describe job tenant-ci-airflow-run-airflow-migrations || true
            kubectl -n tenant-ci-airflow logs job/tenant-ci-airflow-run-airflow-migrations --all-containers --tail=200 || true
            kubectl -n tenant-ci-airflow get events --sort-by=.lastTimestamp | tail -n 40 || true
            echo "::endgroup::"
          }
          trap dump_diag ERR
          # the postgres-lite pod needs POSTGRES_USER/PASSWORD/DB from the ExternalSecret-synced
          # Secret to even start, so that must be Ready before waiting on the pod itself - waiting
          # on the pod first (as this step used to) just burns the whole rollout timeout hiding
          # whatever ESO/Vault problem is actually blocking it.
          for i in $(seq 1 60); do
            ok=$(kubectl -n tenant-ci-airflow get externalsecret tenant-ci-airflow-metadata-conn -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
            [ "$ok" = "True" ] && break
            sleep 5
          done
          [ "$ok" = "True" ] || { echo "::error::tenant-ci-airflow-metadata-conn ExternalSecret never became Ready"; kubectl -n tenant-ci-airflow get externalsecret -o yaml; exit 1; }
          kubectl -n tenant-ci-airflow rollout status statefulset/tenant-ci-airflow-postgres --timeout=180s
          kubectl -n tenant-ci-airflow rollout status deployment/tenant-ci-airflow-scheduler --timeout=300s
          kubectl -n tenant-ci-airflow rollout status deployment/tenant-ci-airflow-dag-processor --timeout=300s
          # triggerer is a StatefulSet in this chart (confirmed from the apply output), not a Deployment
          kubectl -n tenant-ci-airflow rollout status statefulset/tenant-ci-airflow-triggerer --timeout=300s || true

      - name: seed the DAGs PVC directly (no tenant repo to clone from in CI)
        run: |
          set -euo pipefail
          POD=$(kubectl -n tenant-ci-airflow get pods -l component=scheduler -o jsonpath='{.items[0].metadata.name}')
          kubectl -n tenant-ci-airflow cp ci/dags "${POD}:/opt/airflow/dags" -c scheduler
          sleep 20
          echo "checking for DAG import errors..."
          kubectl -n tenant-ci-airflow exec "${POD}" -c scheduler -- airflow dags list-import-errors

      - name: run the integration DAGs
        run: |
          set -euo pipefail
          NS=tenant-ci-airflow
          POD=$(kubectl -n "$NS" get pods -l component=scheduler -o jsonpath='{.items[0].metadata.name}')
          for dag in it_kubernetes_pod_operator it_spark; do
            RUN_ID="ci-$(date +%s)"
            echo "triggering $dag ($RUN_ID)..."
            kubectl -n "$NS" exec "$POD" -c scheduler -- airflow dags trigger "$dag" --run-id "$RUN_ID"
            STATE="running"
            for i in $(seq 1 60); do
              STATE=$(kubectl -n "$NS" exec "$POD" -c scheduler -- airflow dags state "$dag" "$RUN_ID" 2>/dev/null | tail -n1 | tr -d '\r')
              echo "  [$i] $dag -> $STATE"
              [ "$STATE" = "success" ] && break
              [ "$STATE" = "failed" ] && break
              sleep 10
            done
            if [ "$STATE" != "success" ]; then
              echo "::error::$dag did not succeed (state=$STATE)"
              kubectl -n "$NS" exec "$POD" -c scheduler -- airflow tasks states-for-dag-run "$dag" "$RUN_ID" || true
              exit 1
            fi
          done

      - name: dump cluster state
        if: always()
        run: |
          mkdir -p /tmp/diag
          kubectl get applications -n argocd -o wide > /tmp/diag/applications.txt || true
          kubectl get pods -A -o wide > /tmp/diag/pods.txt || true
          kubectl get externalsecrets -A -o wide > /tmp/diag/externalsecrets.txt || true
          kubectl get sparkapplications -A -o wide > /tmp/diag/sparkapplications.txt || true
          for ns in tenant-ci-airflow tenant-ci-workloads vault; do
            kubectl -n "$ns" get events --sort-by=.lastTimestamp > "/tmp/diag/events-${ns}.txt" || true
          done

      - name: upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: /tmp/diag
