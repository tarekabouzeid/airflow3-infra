name: lint

on:
  pull_request:
  push:
    branches: [main, "claude/**"]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          shellcheck scripts/lib/*.sh scripts/*.sh

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yamllint
      - run: yamllint -c .yamllint.yaml .

  verify-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install helm
        uses: azure/setup-helm@v4
      - name: resolve every pinned chart version against the real registries
        run: |
          set -euo pipefail
          source versions.env
          helm repo add argo "${ARGOCD_CHART_REPO}"
          helm repo add apache-airflow "${AIRFLOW_CHART_REPO}"
          helm repo add external-secrets "${ESO_CHART_REPO}"
          helm repo add hashicorp "${VAULT_CHART_REPO}"
          helm repo add spark-operator "${SPARK_OPERATOR_CHART_REPO}"
          helm repo add headlamp "${HEADLAMP_CHART_REPO}"
          helm repo add seaweedfs "${SEAWEEDFS_CHART_REPO}"
          helm repo add kyverno "${KYVERNO_CHART_REPO}"
          helm repo update

          check() {
            local repo_chart=$1 version=$2
            echo "checking ${repo_chart} @ ${version}"
            local versions_json
            versions_json=$(helm search repo "${repo_chart}" --versions -o json)
            if ! echo "${versions_json}" | jq -e --arg v "${version}" 'any(.[]; .version == $v)' >/dev/null; then
              echo "::error::${repo_chart} version ${version} does not exist in the chart repo. Available (newest 10):"
              echo "${versions_json}" | jq -r '.[].version' | head -10 || true
              exit 1
            fi
          }

          check "argo/argo-cd" "${ARGOCD_CHART_VERSION_START}"
          check "argo/argo-cd" "${ARGOCD_CHART_VERSION_STEP2}"
          check "apache-airflow/airflow" "${AIRFLOW_CHART_VERSION}"
          check "headlamp/headlamp" "${HEADLAMP_CHART_VERSION}"
          check "seaweedfs/seaweedfs" "${SEAWEEDFS_CHART_VERSION}"
          check "kyverno/kyverno" "${KYVERNO_CHART_VERSION}"

          # Kueue publishes no classic chart repo - only an OCI one - so `helm search repo` cannot
          # see it. Pull the chart metadata straight from the registry instead, which proves both
          # that the version exists and that an unauthenticated client can fetch it (the same
          # thing Argo CD's repo-server will do).
          echo "checking ${KUEUE_CHART_REPO}/${KUEUE_CHART_NAME} @ ${KUEUE_CHART_VERSION}"
          if ! helm show chart "oci://${KUEUE_CHART_REPO}/${KUEUE_CHART_NAME}" \
               --version "${KUEUE_CHART_VERSION}" > /tmp/kueue-chart.yaml; then
            echo "::error::Kueue chart ${KUEUE_CHART_VERSION} could not be pulled from oci://${KUEUE_CHART_REPO}"
            exit 1
          fi
          # appVersion must match what versions.env claims, or the pinned image tag below is
          # pinning something the chart was never built against.
          actual_app=$(grep '^appVersion:' /tmp/kueue-chart.yaml | awk '{print $2}' | tr -d '"')
          if [ "${actual_app}" != "${KUEUE_APP_VERSION}" ]; then
            echo "::error::Kueue chart ${KUEUE_CHART_VERSION} has appVersion ${actual_app}, but versions.env says ${KUEUE_APP_VERSION}"
            exit 1
          fi

          echo "Latest available versions (informational - not enforced):"
          helm search repo argo/argo-cd --versions | head -5 || true
          helm search repo external-secrets/external-secrets --versions | head -3 || true
          helm search repo hashicorp/vault --versions | head -3 || true
          helm search repo spark-operator/spark-operator --versions | head -3 || true
          helm search repo seaweedfs/seaweedfs --versions | head -3 || true
          helm search repo headlamp/headlamp --versions | head -3 || true

  helm-lint-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install helm
        uses: azure/setup-helm@v4
      - name: install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: add chart repos
        run: |
          source versions.env
          helm repo add apache-airflow "${AIRFLOW_CHART_REPO}"
          helm repo update

      - name: helm lint - tenant-project
        run: helm lint charts/tenant-project
      - name: helm lint - postgres-lite
        run: helm lint charts/postgres-lite
      - name: helm dependency build - airflow-tenant
        run: helm dependency build charts/airflow-tenant
      - name: helm lint - airflow-tenant
        run: helm lint charts/airflow-tenant --set image.tag=3.1.7-hashicorp-2
      - name: helm lint - cluster-governance
        run: helm lint charts/cluster-governance
      - name: helm lint - tenant-queue
        run: helm lint charts/tenant-queue

      - name: render tenant-project (scope=project)
        run: helm template tenant-a-project charts/tenant-project -f tests/fixtures/tenant-a-project.yaml > /tmp/render-project.yaml
      - name: render tenant-project (scope=namespace, airflow)
        run: helm template tenant-a-airflow-ns charts/tenant-project -f tests/fixtures/tenant-a-airflow-ns.yaml > /tmp/render-airflow-ns.yaml
      - name: render tenant-project (scope=namespace, workloads)
        run: helm template tenant-a-workloads-ns charts/tenant-project -f tests/fixtures/tenant-a-workloads-ns.yaml > /tmp/render-workloads-ns.yaml
      - name: render postgres-lite
        run: helm template postgres charts/postgres-lite -f tests/fixtures/postgres-lite.yaml > /tmp/render-postgres.yaml
      - name: render airflow-tenant
        run: helm template tenant-a-airflow charts/airflow-tenant -f tests/fixtures/tenant-a-airflow.yaml > /tmp/render-airflow.yaml
      - name: render cluster-governance
        run: helm template cluster-governance charts/cluster-governance -f tests/fixtures/cluster-governance.yaml > /tmp/render-governance.yaml
      - name: render tenant-queue
        run: helm template tenant-a-queues charts/tenant-queue -f tests/fixtures/tenant-a-queue.yaml > /tmp/render-queues.yaml

      - name: kubeconform - platform-owned CRs (no CRD schemas needed)
        run: kubeconform -strict -summary -ignore-missing-schemas /tmp/render-project.yaml /tmp/render-airflow-ns.yaml /tmp/render-workloads-ns.yaml /tmp/render-postgres.yaml

      # Kueue's ClusterQueue/LocalQueue/Cohort/ResourceFlavor and Kyverno's ClusterPolicy are all
      # CRD-backed, so kubeconform's -ignore-missing-schemas would wave them through unchecked -
      # which is precisely where a wrong field name hides. Validate them against the CRDs shipped
      # in the pinned upstream releases instead. This is not theoretical: it is what caught
      # ResourceFlavor rendering a bare `spec:` (null, rejected by the CRD) whenever the flavor
      # had no node labels or taints.
      - name: CRD-schema validate the governance objects
        run: |
          set -euo pipefail
          source versions.env
          pip install --quiet pyyaml jsonschema
          mkdir -p /tmp/crds
          helm pull "oci://${KUEUE_CHART_REPO}/${KUEUE_CHART_NAME}" --version "${KUEUE_CHART_VERSION}" \
            --untar --untardir /tmp/kueue-chart
          cp /tmp/kueue-chart/kueue/templates/crd/*.yaml /tmp/crds/
          curl -sSL "https://raw.githubusercontent.com/kyverno/kyverno/${KYVERNO_APP_VERSION}/config/crds/kyverno/kyverno.io_clusterpolicies.yaml" \
            -o /tmp/crds/kyverno_clusterpolicies.yaml
          python3 tests/validate_against_crds.py '/tmp/crds/*.yaml' /tmp/render-governance.yaml /tmp/render-queues.yaml

      - name: kubeconform - airflow-tenant (core k8s + CRD catalog for external-secrets)
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas \
            /tmp/render-airflow.yaml

      - name: assert platform-controlled ServiceAccount actually lands on every Airflow pod spec
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          for component in scheduler dag-processor triggerer; do
            echo "checking serviceAccountName on component: ${component}"
            python3 tests/assert_service_account.py "${component}"
          done

      - name: ApplicationSet templates resolve against the real tenant registry
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          # ApplicationSet goTemplate values are just strings until Argo CD renders them against a
          # live registry entry, so a typo in {{.kueue.nominal.cpu}} - or a key missing from one of
          # the four workloads-*.yaml files - is invisible to every other check here.
          for appset in platform/bootstrap/appset-*.yaml; do
            echo "::group::${appset}"
            python3 tests/render_appset_values.py "${appset}" /tmp/appset-values
            echo "::endgroup::"
          done
          # And the resolved values must actually render the chart they are aimed at.
          for values in /tmp/appset-values/*-queues-*.source0.yaml; do
            echo "rendering charts/tenant-queue with ${values}"
            helm template q charts/tenant-queue -f "${values}" > /dev/null
          done

      - name: Kueue ceiling fits inside the namespace ResourceQuota
        run: |
          pip install --quiet pyyaml
          python3 tests/check_quota_invariant.py

      - name: upload rendered manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: /tmp/render-*.yaml
