apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "postgres-lite.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ .Values.nameOverride }}
spec:
  serviceName: {{ include "postgres-lite.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.nameOverride }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.nameOverride }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret | default (printf "%s-postgres-credentials" .Values.global.tenant) }}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # Kubernetes' $(VAR) expansion in exec probe commands only ever substitutes names
          # declared in this container's own env[] list, never envFrom-imported ones - re-declaring
          # POSTGRES_USER as an explicit env entry (tried first) still didn't fix it: pg_isready
          # then reported 'FATAL: role "root" does not exist', i.e. -U resolved to nothing and
          # pg_isready fell back to the exec'd process's OS user (root, since a fresh `exec` into
          # this image starts as root regardless of which user the foreground postgres process
          # dropped to). Running the probe through a real shell instead sidesteps k8s's expansion
          # entirely and reads the container's actual process environment (correctly populated
          # either way), which is the standard workaround for this well-known limitation.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storage.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
