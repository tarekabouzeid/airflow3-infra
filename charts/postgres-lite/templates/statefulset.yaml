apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "postgres-lite.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ .Values.nameOverride }}
spec:
  serviceName: {{ include "postgres-lite.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.nameOverride }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.nameOverride }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret | default (printf "%s-postgres-credentials" .Values.global.tenant) }}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # Kubernetes only expands $(VAR) references (used below in the probes) for names
            # declared in this container's own env[] list - never for envFrom-imported ones, even
            # though they're the same variable at runtime. Without this, pg_isready received the
            # literal, unexpanded string "$(POSTGRES_USER)" as its -U argument and the postgres
            # pod never became ready (confirmed: 'FATAL: role "$(POSTGRES_USER)" does not exist'
            # repeating in its logs). Re-declaring it here (same secret key) makes it expandable
            # without duplicating the value anywhere.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | default (printf "%s-postgres-credentials" .Values.global.tenant) }}
                  key: POSTGRES_USER
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storage.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
