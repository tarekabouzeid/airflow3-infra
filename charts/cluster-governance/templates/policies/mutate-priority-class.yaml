{{- /*
Give every tenant workload a Kueue queueing priority matching the lane it was submitted to.

This rule used to set the pod's own `spec.priorityClassName`, and that does not work. Kubernetes'
built-in Priority admission plugin owns that field: it resolves the class name to an integer,
stamps it into `spec.priority`, and rejects any pod whose integer disagrees with its name. A
mutating webhook that changes the name after the integer is stamped creates exactly that
disagreement, and the API server refuses the pod outright:

  pods "admitted-task" is forbidden: the integer value of priority (0) must not be provided in
  pod spec; priority admission controller computed 1000 from the given PriorityClass name

Found only by governance-kind, on a real cluster - every fixture test passed, because the Kyverno
CLI does not run Kubernetes' built-in admission chain.

Kueue's WorkloadPriorityClass is selected by a LABEL, which no built-in plugin defends, so it can
be set safely here. The lane a tenant picks therefore still decides queueing priority, and the
tenant still sets exactly one field - but the mechanism is now one Kubernetes is happy to allow.

What a tenant pod's own `spec.priorityClassName` ends up as: whatever the tenant set, or unset
(pod priority 0) if they set nothing. Either way it stays below tenant-airflow and far below
platform-critical, so platform components continue to outrank tenant work - and
validate-scheduling.yaml's allowlist is what stops a tenant naming something higher.
*/ -}}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: tenant-default-queue-priority
  labels:
    {{- include "cluster-governance.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Default tenant Kueue priority from the queue lane
    policies.kyverno.io/category: Multi-tenancy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Sets the Kueue WorkloadPriorityClass label from the queue lane a tenant chose, so the lane
      and the queueing priority cannot be set to disagree.
spec:
  background: false
  rules:
    {{- /*
      Two rules matched by label selector rather than one with a JMESPath precondition: a selector
      needs no inline expression, so this file stays free of the Kyverno-vs-Helm delimiter
      collision (both use doubled braces, and Helm parses them even inside a YAML comment). The
      NotIn selector also matches workloads carrying no queue label at all - what a Kubernetes
      label selector does for an absent key - so the two rules are exhaustive and order-independent.

      Both Pod and SparkApplication are matched: a tenant sets the queue label on the
      SparkApplication itself, and Kueue reads the priority label from the same object it reads
      the queue name from.
    */}}
    - name: high-lane-queue-priority
      match:
        any:
          - resources:
              kinds:
                - Pod
                - SparkApplication
              operations:
                - CREATE
              namespaceSelector:
                {{- include "cluster-governance.workloadNamespaceSelector" . | nindent 16 }}
              selector:
                matchLabels:
                  kueue.x-k8s.io/queue-name: {{ .Values.policy.scheduling.highLaneQueueName }}
      exclude:
        {{- include "cluster-governance.excludeBlock" . | nindent 8 }}
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              +(kueue.x-k8s.io/priority-class): {{ .Values.workloadPriorityClasses.high.name }}
    - name: default-queue-priority
      match:
        any:
          - resources:
              kinds:
                - Pod
                - SparkApplication
              operations:
                - CREATE
              namespaceSelector:
                {{- include "cluster-governance.workloadNamespaceSelector" . | nindent 16 }}
              selector:
                matchExpressions:
                  - key: kueue.x-k8s.io/queue-name
                    operator: NotIn
                    values:
                      - {{ .Values.policy.scheduling.highLaneQueueName }}
      exclude:
        {{- include "cluster-governance.excludeBlock" . | nindent 8 }}
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              # Low, not high: work nobody explicitly put in the guaranteed lane is work nobody
              # has claimed is urgent.
              +(kueue.x-k8s.io/priority-class): {{ .Values.workloadPriorityClasses.low.name }}
