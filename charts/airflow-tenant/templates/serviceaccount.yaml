# One ServiceAccount, pinned by name, shared by every Airflow component (scheduler, dag-processor,
# api-server, triggerer, and every KubernetesExecutor worker pod). A single Vault Kubernetes-auth
# role binds to this one identity - see scripts/60-vault-configure.sh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "airflow-tenant.labels" . | nindent 4 }}
