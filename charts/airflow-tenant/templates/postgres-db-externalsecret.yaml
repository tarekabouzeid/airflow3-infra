# Pulls this tenant's metadata-DB credentials out of Vault (<mountPoint>/data/db, written once by
# scripts/60-vault-configure.sh) and produces two Secrets:
#   1. <tenant>-postgres-credentials - env-shaped, consumed by the postgres-lite StatefulSet.
#   2. <tenant>-airflow-metadata-conn - a single SQLAlchemy URI, consumed by the airflow subchart
#      via data.metadataSecretName (never inline plaintext in values.yaml).
# The Postgres hostname is derived here (Helm-templated context), not in values.yaml (which Helm
# never templates): it must match postgres-lite's own fullname convention, "<release>-postgres".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.tenant }}-postgres-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "airflow-tenant.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.tenant }}-vault
    kind: SecretStore
  target:
    name: {{ .Values.tenant }}-postgres-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        POSTGRES_USER: "{{ "{{" }} .user {{ "}}" }}"
        POSTGRES_PASSWORD: "{{ "{{" }} .password {{ "}}" }}"
        POSTGRES_DB: "{{ "{{" }} .dbname {{ "}}" }}"
  data:
    - secretKey: user
      remoteRef:
        key: db
        property: user
    - secretKey: password
      remoteRef:
        key: db
        property: password
    - secretKey: dbname
      remoteRef:
        key: db
        property: dbname
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.tenant }}-airflow-metadata-conn
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "airflow-tenant.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.tenant }}-vault
    kind: SecretStore
  target:
    name: {{ .Values.tenant }}-airflow-metadata-conn
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        connection: >-
          postgresql://{{ "{{" }} .user {{ "}}" }}:{{ "{{" }} .password {{ "}}" }}@{{ .Release.Name }}-postgres:5432/{{ "{{" }} .dbname {{ "}}" }}
  data:
    - secretKey: user
      remoteRef:
        key: db
        property: user
    - secretKey: password
      remoteRef:
        key: db
        property: password
    - secretKey: dbname
      remoteRef:
        key: db
        property: dbname
{{- if .Values.dagLoader.enabled }}
---
# GitHub deploy token for the dag-loader hook Job to clone this tenant's (private) repo.
# Written to Vault by scripts/80-seed-tenant-secrets.sh - never stored in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.tenant }}-git-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "airflow-tenant.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.tenant }}-vault
    kind: SecretStore
  target:
    name: {{ .Values.tenant }}-git-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: git
        property: token
{{- end }}
