# Namespaced (not Cluster-) SecretStore: scoped to this tenant's own Airflow namespace only.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.tenant }}-vault
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "airflow-tenant.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.vault.address }}
      path: {{ .Values.vault.mountPoint }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ .Values.vault.authMountPath }}
          role: {{ .Values.vault.esoRole }}
          serviceAccountRef:
            name: {{ .Values.serviceAccountName }}
