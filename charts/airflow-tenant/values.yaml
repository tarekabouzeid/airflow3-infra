# Platform defaults for a tenant's Airflow 3 deployment. The tenant repo's
# deploy/airflow/values.yaml overrides a SMALL subset of this (image tag, resources, which
# clusters it targets) via the Argo CD multi-source Application - it cannot change the shape
# (executor, secrets backend wiring, DAG delivery mechanism).

tenant: tenant-a
clusterName: af-work-a   # the cluster THIS Airflow instance runs on (used for Vault auth-mount naming)

global:
  tenant: tenant-a   # propagated to the postgres-lite subchart

vault:
  address: http://af-mgmt-control-plane:30820
  # KV-v2 mount holding this tenant's connections/variables (see scripts/60-vault-configure.sh)
  mountPoint: tenant-a
  # Vault Kubernetes auth mount specific to `clusterName` above - one mount per cluster.
  authMountPath: kubernetes-work-a
  airflowRole: tenant-a-airflow
  esoRole: tenant-a-eso

tenantRepo:
  url: https://github.com/tarekabouzeid/airflow3-infra-tenant-a
  branch: main
  dagsPath: dags

image:
  repository: localhost:5001/airflow-tenant
  tag: 3.1.7-hashicorp-1   # built by images/airflow/Dockerfile, pushed by `make images`
  pullPolicy: IfNotPresent

dags:
  pvcSize: 1Gi
  storageClassName: standard

logs:
  pvcSize: 2Gi
  storageClassName: standard

dagLoader:
  # Disabled only by the CI smoke test (e2e-kind.yaml), which seeds the DAGs PVC directly via
  # `kubectl cp` instead of cloning a (there, nonexistent) tenant git repo. Always true for a real
  # tenant deployment.
  enabled: true
  image: alpine/git:2.45.2
  # BeforeHookCreation: a stale loader Job from a previous sync is deleted before the new one
  # runs, so `git push` to the tenant repo -> Argo CD sync -> fresh DAGs, every time.
  hookDeletePolicy: BeforeHookCreation

serviceAccountName: tenant-a-airflow
# The chart does NOT use serviceAccount.name verbatim - it suffixes it per component
# (confirmed by CI: "tenant-a-airflow" + serviceAccount.create=true produced
# "tenant-a-airflow-scheduler" on the scheduler pod, not "tenant-a-airflow"). Vault auth is
# bound by namespace + a wildcard SA name (see scripts/60-vault-configure.sh) specifically to
# avoid needing to enumerate every per-component suffix, but templates/secretstore.yaml still
# needs ONE concrete, always-present SA name to authenticate as - the scheduler's.
vaultServiceAccountName: tenant-a-airflow-scheduler

# --- passed straight through to the apache-airflow/airflow subchart (alias: airflow) ---
# Keys verified against `helm show values apache-airflow/airflow --version <pinned>` in CI
# (.github/workflows/lint.yaml). If a key here doesn't show up in the rendered manifests,
# treat that as this file being wrong, not the chart.
airflow:
  executor: KubernetesExecutor

  # The chart's own values.yaml warns about this: "Disable this if you are using ArgoCD". Default
  # (true) makes both Jobs Helm post-install/post-upgrade hooks, which Argo CD runs as PostSync
  # hooks - meaning they only run after every other Sync-phase resource is Healthy. But every
  # Airflow component Deployment/StatefulSet has its own wait-for-airflow-migrations init
  # container that never succeeds until migrations have actually run - a real deadlock (confirmed
  # locally: every component sat Init:Error forever, and the migrations Job was never even
  # created). false makes both plain Sync-phase resources instead, so they run immediately
  # alongside everything else and the init containers' retry loop succeeds once they complete.
  migrateDatabaseJob:
    useHelmHooks: false
  createUserJob:
    useHelmHooks: false

  images:
    airflow:
      repository: localhost:5001/airflow-tenant
      tag: 3.1.7-hashicorp-1
      pullPolicy: IfNotPresent

  # We own the metadata DB via postgres-lite; disable the chart's bundled one. The connection
  # string itself comes from a Secret (never inline plaintext here) built by
  # templates/postgres-db-externalsecret.yaml from credentials ESO pulls out of Vault.
  postgresql:
    enabled: false
  data:
    metadataSecretName: tenant-a-airflow-metadata-conn

  dags:
    persistence:
      enabled: true
      existingClaim: tenant-a-dags
      accessMode: ReadWriteOnce
    gitSync:
      enabled: false

  logs:
    persistence:
      # The chart hardcodes its logs PVC to ReadWriteMany (no accessMode override key exists in
      # its values schema - confirmed by CI: "additional properties 'accessMode' not allowed" at
      # /logs/persistence). KIND's local-path StorageClass only provisions ReadWriteOnce/ROX, so a
      # persistent+shared logs volume can never be satisfied on this project's single-node
      # clusters (see docs/architecture.md). Disabled rather than worked around: task logs stay
      # local to whichever pod wrote them, which is a real limitation of this lab (not wired up
      # for remote logging), not a workaround for a CI-only constraint.
      enabled: false

  # `name` here is a PREFIX, not a literal name - the chart appends "-<component>" per
  # component (e.g. "tenant-a-airflow-scheduler"). See vaultServiceAccountName above and
  # scripts/60-vault-configure.sh for how Vault auth handles that.
  serviceAccount:
    create: true
    name: tenant-a-airflow

  dagProcessor:
    enabled: true

  # Airflow 3's UI + REST API server (replaces the Airflow 2 "webserver" component name).
  # No apiServer.defaultUser key in this chart's schema (verified by CI) - a default admin user,
  # if the chart creates one at all for this executor, is not disabled here.
  apiServer: {}

  triggerer:
    enabled: true

  webserver:
    enabled: false

  env:
    - name: AIRFLOW__SECRETS__BACKEND
      value: "airflow.providers.hashicorp.secrets.vault.VaultBackend"
    - name: AIRFLOW__SECRETS__BACKEND_KWARGS
      value: >-
        {"connections_path":"connections","variables_path":"variables","config_path":null,
        "mount_point":"tenant-a","auth_type":"kubernetes","kubernetes_role":"tenant-a-airflow",
        "auth_mount_point":"kubernetes-work-a","url":"http://af-mgmt-control-plane:30820"}
