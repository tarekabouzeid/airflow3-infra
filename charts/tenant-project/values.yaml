# scope selects which set of templates render:
#   "project"   -> a single Argo CD AppProject (apply to the Argo CD control-plane cluster only)
#   "namespace" -> Namespace + ResourceQuota + LimitRange + NetworkPolicy + RBAC for ONE namespace
scope: project

tenant: tenant-a

# --- scope: project ---
argocdNamespace: argocd
platformRepoURL: https://github.com/tarekabouzeid/airflow3-infra
tenantRepoURL: https://github.com/tarekabouzeid/airflow3-infra-tenant-a
# Every (cluster server, namespace) pair this tenant's Applications are allowed to deploy into.
destinations:
  - server: https://af-work-a-control-plane:6443
    namespace: tenant-a-airflow
  - server: https://af-work-a-control-plane:6443
    namespace: tenant-a-workloads
  - server: https://af-work-b-control-plane:6443
    namespace: tenant-a-workloads
# Resource kinds tenants are explicitly forbidden from touching in their own namespaces, even
# though the namespace itself is theirs. Deliberately does NOT include ResourceQuota/LimitRange/
# NetworkPolicy: this same tenant AppProject is what the platform's own tenant-airflow Application
# (project: {{.tenant}}) uses to create exactly those three kinds as the tenant's guardrails, in
# the SAME sync unit as the tenant's workload (see appset-tenant-airflow.yaml) - Argo CD's project
# RBAC applies per-Application, not per-source, so blacklisting them here would also block the
# platform's own legitimate creation of them, not just a hypothetical tenant-authored one. Tenants
# have no path to author these kinds anyway (they only ever contribute Helm values, never raw
# manifests, to charts they don't control the templates of).
namespaceResourceBlacklist:
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding

# --- scope: namespace ---
namespace: tenant-a-airflow
# Extra namespaces in the SAME cluster this namespace's pods are allowed to reach
# (e.g. tenant-a-airflow needs no cross-namespace traffic; tenant-a-workloads doesn't either -
# Airflow talks to remote clusters over the k8s API, not pod-to-pod).
networkPolicy:
  allowSameNamespace: true
  allowDNSEgress: true
  allowKubeAPIEgress: true
  extraEgressNamespaceSelectors: []
quota:
  # A full Airflow 3 deployment's own steady-state containers (measured directly against a real
  # local run, not guessed): api-server(1) + dag-processor(2, incl. log-groomer) + scheduler(2) +
  # statsd(1) + postgres(1) + triggerer(2) = 9 containers, each defaulting to limitRange's
  # defaultLimitCPU/Memory below since neither this chart nor the upstream apache-airflow chart
  # sets explicit per-component resources. limits.cpu: "4" (the old value) couldn't even fit the
  # steady state, let alone the migrate-database/create-user/dag-loader Jobs that run concurrently
  # with it during startup - postgres was stuck permanently unable to schedule as a result.
  # limits.cpu: "12" (the next value) fit that steady state but left only ~3 CPU of headroom -
  # not enough once a hook Job (also defaulting to 1 CPU limit) overlaps with two concurrent
  # KubernetesExecutor task pods, e.g. it_spark's wait_local/wait_remote sensors running at once:
  # confirmed locally, one of the two would intermittently 403 with "exceeded quota" even though
  # both tasks and the platform's own RBAC/naming were otherwise correct. The cluster node itself
  # has 28 allocatable CPUs (`kubectl get nodes -o jsonpath='{.items[0].status.allocatable.cpu}'`),
  # so this is quota-sizing, not real contention.
  requests.cpu: "4"
  requests.memory: 6Gi
  limits.cpu: "16"
  limits.memory: 12Gi
  pods: "20"
# Pod Security Admission labels stamped on this namespace. Enforced by the API server itself -
# no admission webhook involved - which is precisely why the level that must never lapse lives
# here rather than in Kyverno. charts/cluster-governance adds `restricted` on top through Kyverno,
# where violations become PolicyReports and can be rolled out in Audit mode first.
#
# enforce is `baseline`, not `restricted`, deliberately: `restricted` additionally demands
# seccompProfile and an explicit drop of ALL capabilities on every container, which neither the
# upstream Airflow chart nor the apache/spark images set on every container. Enforcing it at the
# namespace level would reject platform-supplied workloads outright with no way to grant an
# exception, whereas the Kyverno copy can carry per-control exclusions (see that chart's
# policy.podSecurity.exclude) and still report the gap.
podSecurity:
  enabled: true
  enforce: baseline
  audit: restricted
  warn: restricted
  version: latest

limitRange:
  defaultRequestCPU: 100m
  defaultRequestMemory: 128Mi
  defaultLimitCPU: "1"
  defaultLimitMemory: 1Gi

# --- scope: namespace, workloads namespaces only ---
# Set true only for namespaces where Airflow tasks (KubernetesPodOperator / SparkKubernetesOperator)
# actually land: "<tenant>-workloads" on every cluster the tenant targets (home + remote).
isWorkloadNamespace: false
workloadRunnerServiceAccount: tenant-a-workload-runner
# Set only on the HOME cluster's workloads namespace, so the in-cluster Airflow identity can
# reach it via a plain RoleBinding (no token needed - same cluster, cross-namespace).
# Leave empty on remote clusters: there, scripts/70-remote-access.sh mints a token for
# workloadRunnerServiceAccount and stores it (as a kubeconfig) in Vault instead.
localAirflowServiceAccountNamespace: ""
