{{- if eq .Values.scope "project" }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Values.tenant }}
  namespace: {{ .Values.argocdNamespace }}
  labels:
    {{- include "tenant-project.labels" . | nindent 4 }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Tenant project for {{ .Values.tenant }} - restricts sources, destinations and cluster-scoped resources"
  sourceRepos:
    - {{ .Values.platformRepoURL | quote }}
    - {{ .Values.tenantRepoURL | quote }}
  destinations:
    {{- range .Values.destinations }}
    - server: {{ .server | quote }}
      namespace: {{ .namespace | quote }}
    {{- end }}
  # Tenants get no cluster-scoped resources except their own Namespace object: the platform's
  # tenant-airflow Application (scoped to this project) creates it as part of the same sync unit
  # as the namespace's guardrails and workload (see appset-tenant-airflow.yaml) - no CRDs, no
  # ClusterRoles, nothing else. Tenants have no path to influence the Namespace name/count (it's
  # hardcoded per-tenant in appset-tenant-airflow.yaml, not derived from tenant-controlled input).
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceBlacklist:
    {{- toYaml .Values.namespaceResourceBlacklist | nindent 4 }}
  orphanedResources:
    warn: true
  roles:
    - name: readonly
      description: "Read-only access to {{ .Values.tenant }}'s own applications"
      policies:
        - p, proj:{{ .Values.tenant }}:readonly, applications, get, {{ .Values.tenant }}/*, allow
      groups:
        - {{ .Values.tenant }}-readonly
{{- end }}
