{{- if and (eq .Values.scope "namespace") .Values.isWorkloadNamespace }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workloadRunnerServiceAccount }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "tenant-project.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.tenant }}-workload-runner
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "tenant-project.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    # configmaps needs write access (not just read): the Spark driver creates one per
    # application to propagate executor pod config - confirmed locally, the driver failed with
    # "configmaps is forbidden" (a 403, not a 404/missing-secret style error) trying to POST one.
    # secrets stays read-only; Spark only mounts them, never creates one.
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection", "update", "patch"]
  - apiGroups: [""]
    # Spark's own driver-side cleanup (Client.scala's shutdown hook) issues a single
    # DELETE ...?labelSelector=spark-app-selector=<id> per resource type - the deletecollection
    # verb, distinct from delete on a single named object - for every one of pods, configmaps,
    # services, and persistentvolumeclaims, regardless of whether that type has anything to
    # clean up. Confirmed locally: without these two resource types granted at all (and without
    # deletecollection on pods/configmaps above), the driver's cleanup step fails with 403s that
    # the Kubeflow Spark Operator surfaces as the SparkApplication going to FAILED state even
    # though the actual Spark job already completed successfully.
    resources: ["services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["sparkoperator.k8s.io"]
    resources: ["sparkapplications", "sparkapplications/status", "scheduledsparkapplications"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.tenant }}-workload-runner-self
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "tenant-project.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.workloadRunnerServiceAccount }}
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: {{ .Values.tenant }}-workload-runner
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.localAirflowServiceAccountNamespace }}
---
# Bound to the GROUP every ServiceAccount in the airflow namespace automatically belongs to
# (a built-in Kubernetes convention), not one named ServiceAccount: the official Airflow chart
# derives its own per-component SA names from a prefix (e.g. "tenant-a-airflow-scheduler",
# "tenant-a-airflow-worker" for KubernetesExecutor pods) rather than using one literal name -
# confirmed by CI - so binding by name would need to track every one of those derived names.
# The namespace itself is already this tenant's trust boundary, so this is not a widening.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.tenant }}-workload-runner-local-airflow
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "tenant-project.labels" . | nindent 4 }}
subjects:
  - kind: Group
    name: system:serviceaccounts:{{ .Values.localAirflowServiceAccountNamespace }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: {{ .Values.tenant }}-workload-runner
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
