# Expected output of the tenant-default-queue-priority MUTATE rules, asserted by kyverno-test.yaml.
#
# The assertion that matters is the kueue.x-k8s.io/priority-class LABEL: a workload in the
# guaranteed lane must come out carrying tenant-high, and one in the opportunistic lane (or with
# no lane label at all) tenant-low. Wiring those backwards produces a perfectly valid pod that
# simply queues ahead of work it should sit behind, and no validate rule would notice.
#
# Note what is NOT patched here: spec.priorityClassName. An earlier version of this policy set
# that instead, and it is rejected outright by Kubernetes' Priority admission plugin on a real
# cluster - see the comment at the top of the policy template. These fixtures passed then too,
# which is why governance-kind exists.
---
apiVersion: v1
kind: Pod
metadata:
  name: unprioritised-task
  namespace: tenant-a-workloads
  labels:
    kueue.x-k8s.io/priority-class: tenant-low
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: task
      image: apache/spark:4.0.4
      resources:
        requests: {cpu: "100m", memory: 128Mi}
        limits: {cpu: "1", memory: 1Gi}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Pod
metadata:
  name: high-lane-task
  namespace: tenant-a-workloads
  labels:
    kueue.x-k8s.io/queue-name: high
    kueue.x-k8s.io/priority-class: tenant-high
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: task
      image: apache/spark:4.0.4
      resources:
        requests: {cpu: "100m", memory: 128Mi}
        limits: {cpu: "1", memory: 1Gi}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
