  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: task
      image: apache/spark:4.0.4
      resources:
        requests: {cpu: "100m", memory: 128Mi}
        limits: {cpu: "1", memory: 1Gi}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
---
# No priorityClassName at all - what an Airflow KubernetesPodOperator task looks like unless the
# DAG author goes out of their way. The mutate rule is what stops this being an unranked pod.
apiVersion: v1
kind: Pod
metadata:
  name: unprioritised-task
  namespace: tenant-a-workloads
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: task
      image: apache/spark:4.0.4
      resources:
        requests: {cpu: "100m", memory: 128Mi}
        limits: {cpu: "1", memory: 1Gi}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
---
# The same omission, but in the tenant's AIRFLOW namespace - which must get the much higher
# tenant-airflow class instead. Getting this backwards would let a Spark executor outrank the
# scheduler that launched it.
apiVersion: v1
kind: Pod
metadata:
  name: unprioritised-airflow-component
  namespace: tenant-a-airflow
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: scheduler
      image: localhost:5001/airflow-tenant:3.1.7-hashicorp-2
      resources:
        requests: {cpu: "100m", memory: 256Mi}
        limits: {cpu: "1", memory: 1Gi}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
---
# A task the tenant explicitly put in the guaranteed lane, but which names no PriorityClass - the
# normal case, since the queue label is the only thing a tenant is asked to set. The mutate rules
# must derive tenant-workload-high from the lane, not leave it on the low default: a pod drawing
# on the high ClusterQueue's guaranteed quota while carrying the low PriorityClass would be first
# in line for the capacity and last in line for the CPU.
apiVersion: v1
kind: Pod
metadata:
  name: high-lane-task
  namespace: tenant-a-workloads
  labels:
    kueue.x-k8s.io/queue-name: high
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: task
      image: apache/spark:4.0.4
      resources:
        requests: {cpu: "100m", memory: 128Mi}
        limits: {cpu: "1", memory: 1Gi}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
