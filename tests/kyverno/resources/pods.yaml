# Fixtures for the governance ClusterPolicies. Every pod here lives in tenant-a-workloads, whose
# labels are supplied to the Kyverno CLI by ../values.yaml - the policies match on a namespace
# selector, so without that context every rule would simply skip.
---
# The shape a compliant tenant task actually has: platform registry, explicit tag, requests and
# limits inside the per-container ceiling, a tenant PriorityClass, and a securityContext that
# satisfies `restricted` minus the two controls the chart excludes.
apiVersion: v1
kind: Pod
metadata:
  name: compliant-task
  namespace: tenant-a-workloads
  labels:
    kueue.x-k8s.io/queue-name: high
spec:
  priorityClassName: tenant-workload-high
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: task
      image: localhost:5001/airflow-tenant:3.1.7-hashicorp-2
      resources:
        requests: {cpu: "500m", memory: 512Mi}
        limits: {cpu: "2", memory: 2Gi}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
---
# An image from a registry nobody vetted.
apiVersion: v1
kind: Pod
metadata:
  name: unapproved-registry
  namespace: tenant-a-workloads
spec:
  priorityClassName: tenant-workload-low
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: task
      image: quay.io/somebody/unreviewed:1.0
      resources:
        requests: {cpu: "100m", memory: 128Mi}
        limits: {cpu: "1", memory: 1Gi}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
---
# Allowed registry, but a floating tag - repo rule 7.
apiVersion: v1
kind: Pod
metadata:
  name: floating-tag
  namespace: tenant-a-workloads
spec:
  priorityClassName: tenant-workload-low
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: task
      image: apache/spark:latest
      resources:
        requests: {cpu: "100m", memory: 128Mi}
        limits: {cpu: "1", memory: 1Gi}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
---
# One container asking for more than the per-container ceiling. The namespace ResourceQuota would
# happily allow this - it is only checking the namespace total - which is the whole reason this
# rule exists separately from the quota.
apiVersion: v1
kind: Pod
metadata:
  name: oversized-container
  namespace: tenant-a-workloads
spec:
  priorityClassName: tenant-workload-low
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: task
      image: apache/spark:4.0.4
      resources:
        requests: {cpu: "8", memory: 16Gi}
        limits: {cpu: "8", memory: 16Gi}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
---
# A tenant trying to outrank the platform. This is the one that matters most: a tenant that can
# claim system-cluster-critical can evict the Argo CD and Kueue instances governing it.
apiVersion: v1
kind: Pod
metadata:
  name: priority-escalation
  namespace: tenant-a-workloads
spec:
  priorityClassName: system-cluster-critical
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: task
      image: apache/spark:4.0.4
      resources:
        requests: {cpu: "100m", memory: 128Mi}
        limits: {cpu: "1", memory: 1Gi}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
---
# Pinning to a node bypasses the scheduler, and therefore quota, priority and Kueue admission.
apiVersion: v1
kind: Pod
metadata:
  name: node-pinned
  namespace: tenant-a-workloads
spec:
  nodeName: af-work-a-control-plane
  priorityClassName: tenant-workload-low
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: task
      image: apache/spark:4.0.4
      resources:
        requests: {cpu: "100m", memory: 128Mi}
        limits: {cpu: "1", memory: 1Gi}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
---
# A host port is a cluster-level resource claimed from inside a namespace.
apiVersion: v1
kind: Pod
metadata:
  name: host-port
  namespace: tenant-a-workloads
spec:
  priorityClassName: tenant-workload-low
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: task
      image: apache/spark:4.0.4
      ports:
        - containerPort: 8080
          hostPort: 8080
      resources:
        requests: {cpu: "100m", memory: 128Mi}
        limits: {cpu: "1", memory: 1Gi}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
---
# Privileged: rejected by the Kyverno `restricted` rule here, and independently by the namespace's
# own Pod Security Admission `baseline` label even if Kyverno were down.
apiVersion: v1
kind: Pod
metadata:
  name: privileged
  namespace: tenant-a-workloads
spec:
  priorityClassName: tenant-workload-low
  containers:
    - name: task
      image: apache/spark:4.0.4
      resources:
        requests: {cpu: "100m", memory: 128Mi}
        limits: {cpu: "1", memory: 1Gi}
      securityContext:
        privileged: true
---
# Tolerating the control-plane taint is a way onto nodes that are not tenant capacity. Inert on
# this lab's single-node untainted KIND clusters, which is exactly why it needs a test - nothing
# in the running system would ever exercise it.
apiVersion: v1
kind: Pod
metadata:
  name: tolerates-control-plane
  namespace: tenant-a-workloads
spec:
  priorityClassName: tenant-workload-low
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: task
      image: apache/spark:4.0.4
      resources:
        requests: {cpu: "100m", memory: 128Mi}
        limits: {cpu: "1", memory: 1Gi}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
---
# No priorityClassName at all - what an Airflow KubernetesPodOperator task looks like unless the
# DAG author goes out of their way. The mutate rule is what stops this being an unranked pod.
apiVersion: v1
kind: Pod
metadata:
  name: unprioritised-task
  namespace: tenant-a-workloads
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: task
      image: apache/spark:4.0.4
      resources:
        requests: {cpu: "100m", memory: 128Mi}
        limits: {cpu: "1", memory: 1Gi}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
---
# Tolerating the control-plane taint is a way onto nodes that are not tenant capacity. Inert on
# this lab's single-node untainted KIND clusters, which is exactly why it needs a test - nothing
# in the running system would ever exercise it.
apiVersion: v1
kind: Pod
metadata:
  name: tolerates-control-plane
