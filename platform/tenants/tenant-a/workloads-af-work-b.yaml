# tenant-a's REMOTE workload namespace, on a different cluster than its Airflow instance. Airflow
# reaches it only via the kubeconfig connection scripts/70-remote-access.sh stores in Vault
# (kubernetes_conn_id="k8s_remote") - never a direct in-cluster identity, since Airflow doesn't
# run here at all.
tenant: tenant-a
tenantRepoURL: https://github.com/tarekabouzeid/airflow3-infra-tenant-a
tenantRepoBranch: main
cluster:
  name: af-work-b
  server: https://af-work-b-control-plane:6443
  vaultAuthMountPath: kubernetes-work-b
vault:
  mountPoint: tenant-a
  esoRole: tenant-a-eso
isLocal: false
localAirflowServiceAccountNamespace: ""

# --- Kueue quota for this tenant on THIS cluster (platform-owned) -----------------------------
# Smaller than this tenant's home cluster on purpose: this is the cluster the tenant only reaches
# across the network for specific remote tasks, not where the bulk of its work runs. See the
# corresponding home-cluster registry file for what each field means and for the ResourceQuota
# invariant these numbers have to respect.
kueue:
  nominal:
    cpu: "3"
    memory: 6Gi
    pods: "10"
  borrowingLimit:
    cpu: "3"
    memory: 6Gi
    pods: "10"
