# External Secrets Operator: syncs Vault -> k8s Secret for workload pods (Spark drivers/executors,
# KubernetesPodOperator pods) that cannot call Vault themselves. Runs on every workload cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-af-work-b
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "0.10.4"   # verified by CI against the real chart index; see versions.env
    helm:
      values: |
        installCRDs: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
  destination:
    server: https://af-work-b-control-plane:6443
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
