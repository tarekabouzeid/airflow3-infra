# One multi-source Application per (tenant, workload cluster) pair - where a tenant's Spark /
# KubernetesPodOperator tasks actually land, on the tenant's home cluster AND on any remote
# cluster it targets. Combines:
#   1. charts/tenant-project (scope=namespace, isWorkloadNamespace=true) - Namespace + Quota +
#      LimitRange + NetworkPolicy + the workload-runner ServiceAccount/Role/RoleBinding.
#   2. The tenant's own deploy/workloads chart (SecretStore + ExternalSecret pulling this
#      tenant's workload secrets out of Vault). Tenants own this chart directly - it only ever
#      touches their own namespace, which the AppProject already restricts them to.
# Generator: one entry per platform/tenants/<tenant>/workloads-<cluster>.yaml file. Adding a
# remote cluster for a tenant = adding one such file.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-workloads
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/tarekabouzeid/airflow3-infra
        revision: main
        files:
          - path: "platform/tenants/*/workloads-*.yaml"
  template:
    metadata:
      name: "{{.tenant}}-workloads-{{.cluster.name}}"
      labels:
        app.kubernetes.io/managed-by: argocd
        platform.tenant: "{{.tenant}}"
      annotations:
        # Wave 3, moved down from 2: charts/cluster-governance now occupies wave 2 and
        # must land first, because Kyverno mutates a PriorityClass onto every tenant pod
        # and a pod naming a PriorityClass that does not exist yet is rejected.
        argocd.argoproj.io/sync-wave: "3"
    spec:
      project: "{{.tenant}}"
      sources:
        - repoURL: https://github.com/tarekabouzeid/airflow3-infra
          targetRevision: main
          path: charts/tenant-project
          helm:
            values: |
              scope: namespace
              tenant: {{.tenant}}
              namespace: {{.tenant}}-workloads
              isWorkloadNamespace: true
              workloadRunnerServiceAccount: {{.tenant}}-workload-runner
              localAirflowServiceAccountNamespace: "{{.localAirflowServiceAccountNamespace}}"
              # Sized as a BACKSTOP above the Kueue ceiling, not as the operative limit. Kueue
              # admits a Workload against its own accounting and the API server then applies this
              # ResourceQuota independently; whichever is tighter is what actually binds. If it
              # were this one, Kueue would admit work the API server then rejects - pods stuck
              # Pending on "exceeded quota" while Kueue's own view says they are running, which
              # is a genuinely confusing failure to debug.
              #
              # So: requests here must be >= (kueue.nominal + kueue.borrowingLimit) from every
              # platform/tenants/*/workloads-*.yaml. Today the busiest case is a home cluster at
              # 6+6 CPU / 12+12Gi / 20+20 pods, which is exactly the requests below. The
              # invariant is enforced in CI, not by hope - see lint.yaml's quota-invariant job.
              quota:
                requests.cpu: "12"
                requests.memory: 24Gi
                limits.cpu: "24"
                limits.memory: 32Gi
                pods: "40"
        - repoURL: "{{.tenantRepoURL}}"
          targetRevision: "{{.tenantRepoBranch}}"
          path: deploy/workloads
          helm:
            values: |
              tenant: {{.tenant}}
              vault:
                address: http://af-mgmt-control-plane:30820
                mountPoint: {{.vault.mountPoint}}
                authMountPath: {{.cluster.vaultAuthMountPath}}
                esoRole: {{.vault.esoRole}}
              serviceAccountName: {{.tenant}}-workload-runner
      destination:
        server: "{{.cluster.server}}"
        namespace: "{{.tenant}}-workloads"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
