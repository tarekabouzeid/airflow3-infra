# Argo CD manages itself. Upgrading Argo CD is then a GitOps action: bump targetRevision below,
# commit, push, then sync manually (no `automated` policy here - see syncPolicy below). See
# docs/runbook-argocd-upgrade.md for the full, safe sequence (the app-controller restarts
# mid-sync; briefly seeing Progressing/Unknown here is expected, not a failure).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      # Upgrade rehearsal: started at v2.14.x (see versions.env / docs/runbook-argocd-upgrade.md),
      # now on v3.5.2 - the argocd-redis-secret-init hook wedge that blocked this hop (a known
      # upstream bug, argoproj/argo-helm#2887) is fixed via redisSecretInit.enabled: false in
      # bootstrap/argocd-values.yaml; see that file's comment for detail.
      targetRevision: "10.8.0"
      helm:
        valueFiles:
          - $values/bootstrap/argocd-values.yaml
    - repoURL: https://github.com/tarekabouzeid/airflow3-infra
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    # No `automated` block, deliberately: Argo CD's own self-management is the one Application in
    # this repo where an unattended selfHeal firing mid-upgrade is exactly what caused the
    # argocd-secret fight loop above. Sync manually instead - `argocd app sync argocd` (or the UI)
    # - once you've reviewed what's about to change, same as every other Application here except
    # this one keeps that in your hands rather than firing on every git push automatically. Every
    # OTHER platform Application in this repo keeps `automated: {prune: true, selfHeal: true}` -
    # this exception is narrowly for argocd's own self-management.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # Argo CD's own CRDs exceed the client-side-apply annotation limit
      # Replace=true (removed): confirmed live it fights argocd-server's own runtime writes to
      # argocd-secret (server.secretkey, the admin password hash) - selfHeal saw those as drift
      # from the chart's (empty) manifest for that Secret and Replace=true wholesale-wiped them
      # right back out, in a tight loop, breaking login/session entirely ("server.secretkey is
      # missing" in the UI). ServerSideApply=true alone already covers the actual reason
      # Replace=true was added (the CRDs exceeding the client-side-apply annotation limit).
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
