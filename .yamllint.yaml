extends: default
ignore: |
  charts/*/charts/
  charts/*/templates/
  .local/
  # Generated by tests/kyverno/run.py from charts/cluster-governance; gitignored, and formatted by
  # PyYAML rather than by hand. Linting a machine-written file tells us nothing about this repo.
  tests/kyverno/rendered-policies.yaml
rules:
  line-length:
    max: 140
    level: warning
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on"]
  comments-indentation: disable
  braces:
    max-spaces-inside: 1
