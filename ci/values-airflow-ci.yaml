# Values for the e2e-kind.yaml smoke test: a single "tenant-ci" tenant on ONE kind cluster (no
# remote cluster exists in CI - "k8s_remote" is wired to point back at the same cluster via an
# explicit kubeconfig connection instead of the in-cluster identity, which still exercises the
# real KubernetesPodOperator/SparkKubernetesOperator "external connection" code path).
# dagLoader is disabled here: e2e-kind.yaml seeds the DAGs PVC directly with `kubectl cp` instead
# of cloning a tenant git repo (there is no tenant-ci repo - this fixture lives in this platform
# repo instead, see ci/dags/).
tenant: tenant-ci
clusterName: ci
global:
  tenant: tenant-ci
vault:
  address: http://vault.vault.svc:8200
  mountPoint: tenant-ci
  authMountPath: kubernetes-ci
  airflowRole: tenant-ci-airflow
  esoRole: tenant-ci-eso
serviceAccountName: tenant-ci-airflow
vaultServiceAccountName: tenant-ci-airflow-scheduler
dagLoader:
  enabled: false
image:
  repository: airflow-tenant
  tag: ci-1
  pullPolicy: IfNotPresent
airflow:
  images:
    airflow:
      repository: airflow-tenant
      tag: ci-1
      pullPolicy: IfNotPresent
  data:
    metadataSecretName: tenant-ci-airflow-metadata-conn
  serviceAccount:
    create: true
    name: tenant-ci-airflow
  dags:
    persistence:
      enabled: true
      existingClaim: tenant-ci-dags
      accessMode: ReadWriteOnce
  logs:
    persistence:
      # Chart default is ReadWriteMany; KIND's local-path StorageClass only provisions RWO.
      # Confirmed failure: "failed to provision volume with StorageClass \"standard\": NodePath
      # only supports ReadWriteOnce and ReadWriteOncePod (1.22+) access modes". Every cluster in
      # this project is single-node (see docs/architecture.md), so RWO is sufficient - all pods
      # mounting logs land on the same node.
      accessMode: ReadWriteOnce
  # Chart defaults size each component for a real cluster (e.g. scheduler/triggerer request
  # limits.cpu=2 each) - on the GitHub Actions runner these blew straight through the tenant's
  # 4-CPU ResourceQuota before postgres or the scheduler could even be admitted. Confirmed
  # failure: "exceeded quota: tenant-ci-quota, requested: limits.cpu=2, used: limits.cpu=4,
  # limited: limits.cpu=4". Scaled down for this smoke test only - the quota mechanics themselves
  # (and the real per-tenant defaults in charts/tenant-project/values.yaml) are unchanged.
  scheduler:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 300m, memory: 512Mi}
  dagProcessor:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 300m, memory: 512Mi}
  apiServer:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 300m, memory: 512Mi}
  triggerer:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 300m, memory: 512Mi}
  workers:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 300m, memory: 512Mi}
  statsd:
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 100m, memory: 128Mi}
  createUserJob:
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 300m, memory: 256Mi}
  migrateDatabaseJob:
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 300m, memory: 256Mi}
  env:
    - name: AIRFLOW__SECRETS__BACKEND
      value: "airflow.providers.hashicorp.secrets.vault.VaultBackend"
    - name: AIRFLOW__SECRETS__BACKEND_KWARGS
      value: >-
        {"connections_path":"connections","variables_path":"variables","config_path":null,
        "mount_point":"tenant-ci","auth_type":"kubernetes","kubernetes_role":"tenant-ci-airflow",
        "kubernetes_mount_point":"kubernetes-ci","url":"http://vault.vault.svc:8200"}
