# Values for the e2e-kind.yaml smoke test: a single "tenant-ci" tenant on ONE kind cluster (no
# remote cluster exists in CI - "k8s_remote" is wired to point back at the same cluster via an
# explicit kubeconfig connection instead of the in-cluster identity, which still exercises the
# real KubernetesPodOperator/SparkKubernetesOperator "external connection" code path).
# dagLoader is disabled here: e2e-kind.yaml seeds the DAGs PVC directly with `kubectl cp` instead
# of cloning a tenant git repo (there is no tenant-ci repo - this fixture lives in this platform
# repo instead, see ci/dags/).
tenant: tenant-ci
clusterName: ci
global:
  tenant: tenant-ci
vault:
  address: http://vault.vault.svc:8200
  mountPoint: tenant-ci
  authMountPath: kubernetes-ci
  airflowRole: tenant-ci-airflow
  esoRole: tenant-ci-eso
serviceAccountName: tenant-ci-airflow
vaultServiceAccountName: tenant-ci-airflow-scheduler
dagLoader:
  enabled: false
image:
  repository: airflow-tenant
  tag: ci-1
  pullPolicy: IfNotPresent
airflow:
  images:
    airflow:
      repository: airflow-tenant
      tag: ci-1
      pullPolicy: IfNotPresent
  data:
    metadataSecretName: tenant-ci-airflow-metadata-conn
  serviceAccount:
    create: true
    name: tenant-ci-airflow
  dags:
    persistence:
      enabled: true
      existingClaim: tenant-ci-dags
      accessMode: ReadWriteOnce
  # logs.persistence is disabled by charts/airflow-tenant/values.yaml's own default (the chart
  # hardcodes that PVC to ReadWriteMany, which KIND's local-path StorageClass can't provision -
  # see the comment there), so no override is needed here.
  # Chart defaults size each component for a real cluster (e.g. scheduler/triggerer request
  # limits.cpu=2 each) - on the GitHub Actions runner these blew straight through the tenant's
  # 4-CPU ResourceQuota before postgres or the scheduler could even be admitted. Confirmed
  # failure: "exceeded quota: tenant-ci-quota, requested: limits.cpu=2, used: limits.cpu=4,
  # limited: limits.cpu=4". Scaled down for this smoke test only - the quota mechanics themselves
  # (and the real per-tenant defaults in charts/tenant-project/values.yaml) are unchanged.
  #
  # requests.cpu specifically had to come down further still: the GitHub Actions runner's KIND
  # node has only 2 CPU total (confirmed via `kubectl describe node`'s Capacity/Allocatable), and
  # kube-system + Argo CD + Vault alone already request ~1.4 of those 2 CPUs before any tenant
  # workload exists - leaving well under 1 CPU of real scheduling headroom for the whole
  # tenant-ci-airflow stack. Scheduling admission is decided on requests, not limits, so limits
  # can stay comfortable while requests stay minimal.
  #
  # limits.cpu was raised again (300m -> 1000m) after the memory fix above got the migrations job
  # completing: scheduler/dag-processor/api-server/triggerer then all failed their startup/liveness
  # probes with "command timed out ... timed out after 20s" running `airflow jobs check` - CPU
  # throttling under real contention (many Airflow components starting at once on a shared 2-CPU
  # node), not a code or config problem. Raising the LIMIT (not the request) costs nothing in
  # scheduling budget - only requests count toward node admission - but lets each container burst
  # to the CPU it needs during startup instead of being throttled by the CFS quota.
  scheduler:
    resources:
      requests: {cpu: 50m, memory: 256Mi}
      limits: {cpu: 1000m, memory: 512Mi}
  dagProcessor:
    resources:
      requests: {cpu: 50m, memory: 256Mi}
      limits: {cpu: 1000m, memory: 512Mi}
  apiServer:
    resources:
      requests: {cpu: 50m, memory: 256Mi}
      limits: {cpu: 1000m, memory: 512Mi}
  triggerer:
    resources:
      requests: {cpu: 50m, memory: 256Mi}
      limits: {cpu: 1000m, memory: 512Mi}
  workers:
    resources:
      requests: {cpu: 50m, memory: 256Mi}
      limits: {cpu: 1000m, memory: 512Mi}
  statsd:
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {cpu: 100m, memory: 128Mi}
  createUserJob:
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 1000m, memory: 512Mi}
  # run-airflow-migrations crashes with zero stdout/stderr on every attempt (confirmed: both
  # `kubectl logs --previous` and the current attempt come back completely empty despite the
  # container visibly restarting) - a container dying with no output at all, even with
  # PYTHONUNBUFFERED=1 set, is the signature of an OOMKill: the kernel SIGKILLs the process before
  # anything can flush, bypassing process-level output buffering entirely. `airflow db migrate` on
  # a brand-new schema, loading every installed provider (including this image's extra
  # apache-airflow-providers-hashicorp), plausibly exceeds 256Mi. The node has ample memory
  # headroom (~50% used per the node diagnostics; CPU, not memory, was the tight constraint
  # earlier), so raising this substantially is safe.
  migrateDatabaseJob:
    resources:
      requests: {cpu: 50m, memory: 256Mi}
      limits: {cpu: 300m, memory: 1Gi}
  env:
    - name: AIRFLOW__SECRETS__BACKEND
      value: "airflow.providers.hashicorp.secrets.vault.VaultBackend"
    - name: AIRFLOW__SECRETS__BACKEND_KWARGS
      value: >-
        {"connections_path":"connections","variables_path":"variables","config_path":null,
        "mount_point":"tenant-ci","auth_type":"kubernetes","kubernetes_role":"tenant-ci-airflow",
        "auth_mount_point":"kubernetes-ci","url":"http://vault.vault.svc:8200"}
postgres-lite:
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
